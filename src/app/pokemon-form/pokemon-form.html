<div class="pokedex-container">
  <h2>{{ editingId() ? 'Update Pokemon': 'Register Pokemon'}}</h2>

  <form [formGroup]="pokemonForm" (ngSubmit)="onSubmit()" class="pokemon-form">
    <div class="form-group">
      <label for="name">Pokemon Name</label>
      <input id="name" type="text" formControlName="name" placeholder="e.g. Pikachu" />
    </div>

    <div class="form-group">
      <label for="type">Type</label>
      <input id="type" type="text" formControlName="type" placeholder="e.g. Electric" />
    </div>

    <div class="form-group">
      <label for="level">Level</label>
      <input id="level" type="number" formControlName="level" />
    </div>

    <div class="form-group">
      <label for="nature">Nature</label>
      <input id="nature" type="text" formControlName="nature" placeholder="e.g. Jolly" />
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="pokemonForm.invalid" class="btn-submit">
        {{ editingId() ? 'Confirm Update' : 'Catch Pokemon' }}
      </button>

      @if(editingId()){
        <button type="button" (click)="cancelEdit()" class="btn-cancel"> Cancel </button>
      }
    </div>
  </form>

  <hr />

  <h3>Current Pokedex</h3>
  <div class="pokemon-grid">
    @for (p of pokemonService.pokemonList(); track p._id) {
      <div class="pokemon-card">
        <div class="card-info">
          <strong>{{ p.name }}</strong>
          <span>(Lvl {{ p.level }})</span>
          <p>{{ p.type }} | {{ p.nature }}</p>
        </div>
        <div class="card-actions">
          <button (click)="startEdit(p)" class="btn-edit">Edit</button>
          <button (click)="deletePokemon(p._id)" class="btn-delete">Release</button>
        </div>
      </div>
    }
  </div>
</div>
